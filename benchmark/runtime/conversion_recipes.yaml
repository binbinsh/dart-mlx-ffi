models:
  paddle_ocr_vl:
    source_model: PaddlePaddle/PaddleOCR-VL-1.5
    task: vlm
    recipes:
      coreml:
        preset: coreml_paddleocr_vl
        extra_args: [--trust-remote-code]
      litert:
        preset: litert_onnx_pipeline2tf
        extra_args:
          - --onnx2tf-extra-arg=-b
          - --onnx2tf-extra-arg
          - "1"

  qwen3_vl:
    source_model: Qwen/Qwen3-VL-2B-Instruct
    task: vlm
    recipes:
      litert:
        preset: litert_hf_vlm
        extra_args:
          - --trust-remote-code
          - --bundle-litert-lm
          - --export-vision-encoder
          - --prefill-lengths
          - "64,128"
          - --cache-length
          - "1024"

  qwen3_asr:
    source_model: Qwen/Qwen3-ASR-1.7B
    task: audio
    recipes:
      coreml:
        engine: coreml
        exporter: coreml-asr-stateful-components
        platforms: [ios, macos]
        preflight_blocked: true
        preflight_failure_class: coreml_ane_compile_failed
        preflight_failure_reason: Qwen3-ASR Core ML stateful runner is implemented and resolves tokenizer sidecars, but the public decoder fails default ANE execution-plan compilation; keep the public Core ML bundle staging on cpuAndGPU until ANE passes.
        runner: Qwen3AsrCoreMlRunner.loadCoreMlBundle
      onnx:
        engine: onnx
        exporter: onnx-asr-components
        platforms: [windows, linux, android]
        provider_by_platform:
          windows: dml
          linux: cpu
          android: npu
        runner: Qwen3AsrNativeRunner.loadOnnxBundle
        artifact_candidates:
          - .
          - encoder.int4.onnx
          - decoder_init.int4.onnx
          - decoder_step.int4.onnx
          - embed_tokens.bin
      litert:
        preset: litert_qwen3_asr_onnx_components
        onnx_repo: andrewleech/qwen3-asr-1.7b-onnx
        runner: Qwen3AsrNativeRunner.loadLiteRtBundle

  silero_vad:
    source_model: snakers4/silero-vad
    task: vad
    recipes:
      litert:
        preset: litert_onnx2tf
        attempt_timeout_seconds: 180
        onnx_repo: onnx-community/silero-vad
        onnx_artifact: onnx/model.onnx
        extra_args:
          - --source-candidate
          - runanywhere/silero-vad-v5::silero_vad.onnx
          - --source-candidate
          - istupakov/silero-vad-onnx::silero_vad_16k_op15.onnx
          - --source-candidate
          - istupakov/silero-vad-onnx::silero_vad_op18_ifless.onnx

  kitten_tts:
    source_model: KittenML/kitten-tts-mini-0.8
    task: tts
    recipes:
      litert:
        preset: litert_onnx2tf
        attempt_timeout_seconds: 180
        onnx_repo: onnx-community/KittenTTS-Mini-v0.8-ONNX
        onnx_artifact: onnx/model.onnx
        extra_args:
          - --source-candidate
          - onnx-community/KittenTTS-Mini-v0.8-ONNX::onnx/model.onnx
          - --source-candidate
          - KittenML/kitten-tts-mini-0.8::kitten_tts_mini_v0_8.onnx

  qwen3_6_27b:
    source_model: Qwen/Qwen3.6-27B
    task: text
    recipes:
      coreml:
        preset: coreml_coremlllm
      onnx:
        preset: onnx_ort_genai_text_generation_model_type_patch
        model_type_expected: qwen3_5
        model_type_patch: qwen3
        timeout_seconds: 21600
        extra_args:
          - --extra-option
          - filename=model.onnx
      litert:
        preset: litert_hf_text_generation_model_type_patch
        model_type_expected: qwen3_5
        model_type_patch: qwen3
        timeout_seconds: 21600
        extra_args:
          - --bundle-litert-lm
          - --prefill-lengths
          - "64,128"
          - --cache-length
          - "1024"

  translategemma_4b_it:
    source_model: google/translategemma-4b-it
    task: text
    recipes:
      coreml:
        preset: coreml_coremlllm
      onnx:
        preset: onnx_text_generation

  minicpm_o_4_5:
    source_model: openbmb/MiniCPM-o-4_5
    task: vlm
    recipes:
      coreml:
        engine: coreml
        exporter: coreml-preflight
        platforms: [ios, macos]
        preflight_blocked: true
        preflight_failure_class: coreml_exporter_missing_for_vlm
        preflight_failure_reason: MiniCPM-o 4.5 is a multimodal VLM/audio bundle; no production Core ML converter is wired for the full runtime bundle yet.
      onnx:
        preset: onnx_vlm
        extra_args: [--trust-remote-code]
      litert:
        preset: litert_hf_vlm
        extra_args:
          - --trust-remote-code
          - --auto-model-override
          - AutoModelForCausalLM
          - --patch-minicpm-optional-deps
          - --bundle-litert-lm
          - --export-vision-encoder
          - --prefill-lengths
          - "64,128"
          - --cache-length
          - "1024"

  gemma_sea_lion_v4_4b_vl:
    source_model: aisingapore/Gemma-SEA-LION-v4-4B-VL
    task: vlm
    recipes:
      coreml:
        preset: coreml_coremlllm
      onnx:
        preset: onnx_vlm
        extra_args: [--trust-remote-code]
      litert:
        preset: litert_hf_vlm
        extra_args:
          - --trust-remote-code
          - --bundle-litert-lm
          - --export-vision-encoder
          - --prefill-lengths
          - "64,128"
          - --cache-length
          - "1024"

  ming_omni_tts_0_5b:
    source_model: inclusionAI/Ming-omni-tts-0.5B
    task: tts
    recipes:
      coreml:
        engine: coreml
        exporter: coreml-preflight
        platforms: [ios, macos]
        preflight_blocked: true
        preflight_failure_class: coreml_exporter_missing_for_tts
        preflight_failure_reason: Ming-omni TTS needs a text-to-speech Core ML pipeline; no production Core ML converter is wired for the full runtime bundle yet.
      onnx:
        preset: onnx_ming_omni_text_to_audio
        extra_args: [--trust-remote-code]
      litert:
        preset: litert_ming_omni_text_to_audio
        extra_args:
          - --trust-remote-code
          - --bundle-litert-lm
