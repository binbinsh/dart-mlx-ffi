version: 1
output_root: benchmark/artifacts/converted
tools_root: benchmark/artifacts/tools
source_artifact_catalog: benchmark/runtime/hf_artifacts.yaml
seed_models_from_catalog: true

presets:
  coreml_coremlllm:
    engine: coreml
    exporter: coreml-llm
    tool_repo: https://github.com/john-rocky/CoreML-LLM.git
    tool_name: coreml-llm
    platforms: [ios, macos]
    context_length: 2048
    quantize: int4
    command:
      - uv
      - run
      - --with-requirements
      - "{tool_dir}/conversion/requirements.txt"
      - python
      - "{tool_dir}/conversion/convert.py"
      - --model
      - "{source_model}"
      - --context-length
      - "{context_length}"
      - --quantize
      - "{quantize}"
      - --output
      - "{output_dir}"
      - "{extra_args}"
    artifact_candidates:
      - "**/*.mlmodelc"
      - "*.mlmodelc"
      - "**/*.mlpackage"
      - "*.mlpackage"

  coreml_paddleocr_vl:
    engine: coreml
    exporter: coremltools-paddleocr-vl
    platforms: [ios, macos]
    sequence_length: 160
    command:
      - uv
      - run
      - --group
      - coreml-convert
      - --with
      - transformers==4.55.0
      - python
      - benchmark/runtime/converters/paddleocr_vl_coreml.py
      - --model
      - "{source_model}"
      - --output-dir
      - "{output_dir}"
      - --prompt-file
      - benchmark/runtime/fixtures/text_prompt.txt
      - --image-file
      - benchmark/runtime/fixtures/image.png
      - --sequence-length
      - "{sequence_length}"
      - "{extra_args}"
    artifact_candidates:
      - "pipeline.json"
      - "**/pipeline.json"
      - "*.mlpackage"
      - "**/*.mlpackage"

  onnx_text_generation:
    engine: onnx
    exporter: optimum-cli
    export_task: text-generation-with-past
    opset: 18
    platforms: [windows, linux]
    provider_by_platform:
      windows: dml
      linux: cpu
    command:
      - uvx
      - --from
      - "optimum[onnxruntime]==2.1.0"
      - --with
      - "accelerate>=1.13.0"
      - --with
      - "onnx>=1.21.0"
      - --with
      - "onnxruntime>=1.25.0"
      - --with
      - "transformers>=4.57.0,<4.58.0"
      - --with
      - "torch>=2.11.0"
      - --with
      - "torchvision>=0.26.0"
      - "{with_args}"
      - optimum-cli
      - export
      - onnx
      - --model
      - "{source_model}"
      - --task
      - "{export_task}"
      - --opset
      - "{opset}"
      - "{extra_args}"
      - "{output_dir}"
    artifact_candidates:
      - "**/decoder_model_merged*.onnx"
      - "decoder_model_merged*.onnx"
      - "**/model*.onnx"
      - "model*.onnx"
      - "**/*.onnx"
      - "*.onnx"

  onnx_text_generation_model_type_patch:
    engine: onnx
    exporter: optimum-cli-model-type-patched
    export_task: text-generation-with-past
    opset: 18
    platforms: [windows, linux]
