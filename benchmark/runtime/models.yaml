version: 1
support_policy:
  production_requires:
    platforms: [ios, macos, windows, linux, android]
    correctness: true
    speed: true
    peak_memory: true
  thresholds:
    min_speed_ratio: 0.90
    max_ttft_ratio: 1.10
    max_peak_memory_ratio: 1.10
    min_embedding_cosine: 0.999
    max_embedding_l2: 0.001
    max_abs_diff: 0.0001
    require_device_profile: true
    required_coreml_preferred_device: ane

first_wave:
  - id: qwen2_5
    family: Qwen2.5
    task: text
    source_model: Qwen/Qwen2.5-0.5B-Instruct
    source_artifacts: huggingface
    support_level: staging
    coreml_llm_baseline: true
  - id: qwen3_5
    family: Qwen3.5
    task: text
    source_model: Qwen/Qwen3.5-0.8B
    source_artifacts: huggingface
    support_level: staging
    coreml_llm_baseline: true
